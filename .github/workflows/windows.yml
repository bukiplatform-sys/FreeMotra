name: Windows x64
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sponsor-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test sponsor-admin/test.mjs supabase/tests.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: FreeMotra-Sponsor-Studio-source
          path: sponsor-admin/
  build:
    needs: sponsor-admin
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia'
          cache: true
      - name: Cache native WebRTC dependencies
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: webrtc-windows-static-md-release-v2
      - run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/cmake/triplets"
      - name: Preserve compiled dependencies even if application build fails
        uses: actions/cache/save@v4
        with:
          path: build/vcpkg_installed
          key: webrtc-windows-static-md-release-v2
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Test diagnostics
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem build -Recurse -Filter freemotra-diagnostics.log | ForEach-Object { Get-Content $_.FullName }
          Get-Content build/Testing/Temporary/LastTest.log -ErrorAction SilentlyContinue
      - name: Capture actual QML window
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'windows'
          $env:QT_QUICK_BACKEND = 'software'
          $p = Start-Process ./build/Release/FreeMotra.exe -ArgumentList '--screenshot' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Screenshot failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: FreeMotra-preview
          path: FreeMotra-preview.png
      - run: cmake --install build --config Release --prefix "${{ github.workspace }}/stage"
      - name: Verify deployed application without Qt SDK paths
        shell: pwsh
        run: |
          $crt = Get-ChildItem 'C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Redist/MSVC' -Recurse -Directory -Filter Microsoft.VC143.CRT | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if ($crt) { Copy-Item "$($crt.FullName)/*.dll" ./stage/bin/ }
          Get-ChildItem ./stage -Recurse | Select-Object FullName
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          Remove-Item Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $p = Start-Process -FilePath ./stage/bin/FreeMotra.exe -ArgumentList '--smoke-test' -WorkingDirectory ./stage/bin -PassThru
          if (-not $p.WaitForExit(20000)) { Stop-Process -Id $p.Id -Force; Get-Content ./stage/bin/freemotra-diagnostics.log -ErrorAction SilentlyContinue; throw 'Deployed startup timed out' }
          $p.Refresh()
          if ($p.ExitCode -ne 0) { Get-Content ./stage/bin/freemotra-diagnostics.log; throw "Deployed app failed: $($p.ExitCode)" }
      - run: cpack --config build/CPackConfig.cmake -C Release -G ZIP -B dist
      - run: cpack --config build/CPackConfig.cmake -C Release -G NSIS -B dist
      - uses: actions/upload-artifact@v4
        with:
          name: FreeMotra-windows-x64
          path: |
            dist/FreeMotra-*-windows-x64.exe
            dist/FreeMotra-*-windows-x64.zip

      - name: Publish tested version for application updates
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content vcpkg.json | ConvertFrom-Json).'version-string'
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $tag = "v$version"
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (($existing | ConvertFrom-Json).isDraft) { throw "Existing draft $tag requires review before publication." }
            Write-Output "Version $tag already published; keeping its files unchanged."
            exit 0
          }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "FreeMotra $version" --notes-file docs/RELEASE-NOTES.md --draft "dist/FreeMotra-$version-windows-x64.exe" "dist/FreeMotra-$version-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed' }
          $asset = $release.assets | Where-Object { $_.name -eq "FreeMotra-$version-windows-x64.exe" }
          $expected = 'sha256:' + (Get-FileHash "dist/FreeMotra-$version-windows-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $asset -or $asset.digest -ne $expected) { throw 'Release SHA-256 mismatch; draft not published' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
